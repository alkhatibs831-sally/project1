<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <div class="container">
      <span class="navbar-brand">Expense Tracker</span>
    </div>
  </nav>

  <main class="container my-4">

    <div class="row g-3 mb-4">
      <div class="col-12 col-md-4">
        <div class="card stat-card">
          <div class="card-body">
            <p class="stat-label">Total spent</p>
            <h3 id="totalSpent">$0.00</h3>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="card stat-card">
          <div class="card-body">
            <p class="stat-label">Number of expenses</p>
            <h3 id="expenseCount">0</h3>
          </div>
        </div>
      </div>
      <div class="col-12 col-md-4">
        <div class="card stat-card">
          <div class="card-body">
            <p class="stat-label">Biggest expense</p>
            <h3 id="biggestExpense">$0.00</h3>
          </div>
        </div>
      </div>
    </div>
    <!-- الفورم -->
    <div class="card form-card mb-4">
      <div class="card-body">
        <h5 class="mb-3">Add expense</h5>

        <form id="expenseForm" novalidate>
          <div class="row g-3">

            <div class="col-12 col-md-6">
              <label for="description" class="form-label">Description</label>
              <input type="text" id="description" class="form-control" placeholder="e.g. Lunch">
              <div class="error-msg" id="descriptionError"></div>
            </div>

            <div class="col-12 col-md-6">
              <label for="amount" class="form-label">Amount</label>
              <input type="number" id="amount" class="form-control" placeholder="0.00" step="0.01">
              <div class="error-msg" id="amountError"></div>
            </div>

            <div class="col-12 col-md-6">
              <label for="category" class="form-label">Category</label>
              <select id="category" class="form-select">
                <option value="">Choose a category</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
              </select>
              <div class="error-msg" id="categoryError"></div>
            </div>

            <div class="col-12 col-md-6">
              <label for="date" class="form-label">Date</label>
              <input type="date" id="date" class="form-control">
              <div class="error-msg" id="dateError"></div>
            </div>

          </div>

          <button type="submit" class="btn btn-main mt-3">Add expense</button>
        </form>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <div class="row g-2 mb-3 align-items-center">
  <div class="col-12 col-md-4">
    <h5 class="mb-0">Expenses</h5>
  </div>
  <div class="col-6 col-md-4">
    <select id="filterCategory" class="form-select">
      <option value="">All categories</option>
      <option value="Food">Food</option>
      <option value="Transport">Transport</option>
      <option value="Shopping">Shopping</option>
      <option value="Bills">Bills</option>
      <option value="Entertainment">Entertainment</option>
      <option value="Other">Other</option>
    </select>
  </div>
  <div class="col-6 col-md-4">
    <select id="sortAmount" class="form-select">
      <option value="">Sort by amount</option>
      <option value="high">Highest first</option>
      <option value="low">Lowest first</option>
    </select>
  </div>
</div>

        <div class="table-responsive">
          <table class="table align-middle">
            <thead>
              <tr>
                <th>Description</th>
                <th>Category</th>
                <th>Date</th>
                <th>Amount</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="expenseList">
              <tr>
                <td colspan="5" class="text-center text-muted">No expenses yet</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
